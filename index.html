<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent !important;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        video {
            width: 100%;
            height: auto;

            /* 1. This is the primary way to remove black */
            mix-blend-mode: screen; 

            /* 2. ADDED: This is a fallback filter that helps 
               remove any 'gray' or 'dark' pixels that mix-blend-mode missed */
            filter: contrast(1.1) brightness(1.1);
        }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline id="logoVideo">
        <source src="366.webm" type="video/webm">
    </video>

</body>
</html>
