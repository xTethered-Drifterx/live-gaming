<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Invisible background for the web page itself */
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; 
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        video {
            /* Adjust this percentage to change logo size on your screen */
            width: 100%; 
            height: auto;

            /* THE MAGIC LINE: This removes the black background perfectly 
               and blends the logo details with the gameplay behind it. */
            mix-blend-mode: screen; 

            /* Boosts the brightness of the circuit boards and lightning 
               to make them pop against the game footage */
            filter: brightness(1.3) contrast(1.2);
        }
    </style>
</head>
<body>

    <video autoplay loop muted playsinline>
        <source src="366.webm" type="video/webm">
    </video>

</body>
</html>
